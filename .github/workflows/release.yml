name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test:unit

      - name: Package (dry run)
        run: yarn package

  publish:
    needs: test
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify version matches tag
        if: github.event_name == 'push'
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: package.json version ($PACKAGE_VERSION) does not match git tag ($TAG_VERSION). Bump the version in package.json first, then re-tag."
            exit 1
          fi
          echo "Version verified: $PACKAGE_VERSION"

      - name: Publish to VS Code Marketplace
        run: yarn vsce publish -p "$VSCE_PAT" --no-git-tag-version
