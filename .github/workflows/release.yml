name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test:unit

      - name: Package (dry run)
        run: yarn package

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify version matches tag
        if: github.event_name == 'push'
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: package.json version ($PACKAGE_VERSION) does not match git tag ($TAG_VERSION). Bump the version in package.json first, then re-tag."
            exit 1
          fi
          echo "Version verified: $PACKAGE_VERSION"

      - name: Publish to VS Code Marketplace
        run: yarn vsce publish -p "$VSCE_PAT" --no-git-tag-version

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          # Idempotent: no-op when a release for this tag already exists.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release for ${GITHUB_REF_NAME} already exists — skipping."
            exit 0
          fi

          # Extract the changelog section for this version: from the "## [<VERSION>]" line
          # up to the next "## [" line or end of file.
          NOTES_FILE="$(mktemp)"
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [ -s "$NOTES_FILE" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "v${VERSION}" \
              --notes-file "$NOTES_FILE"
          else
            echo "No changelog section found for v${VERSION} — using auto-generated notes."
            gh release create "$GITHUB_REF_NAME" \
              --title "v${VERSION}" \
              --generate-notes
          fi

          rm -f "$NOTES_FILE"
